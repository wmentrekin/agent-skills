# Contract: live coordination artifact maintained by $work

artifact: status
feature: "context-parity"
mode: "bounded-feature"
stage: "execution"
owner_skill: work

objective: >
  Determine whether Claude Code's higher observed adherence to this
  framework's multi-step workflow (vs. Codex CLI and Antigravity) is
  explained by how each tool loads/retains instruction context over a long
  session, and design concrete framework changes to close the gap. Also
  verify/harden the existing "no direct commits to main" branch+PR
  requirement so it applies unambiguously across all $work stages.

summary:
  current_focus: "Execution complete (T1-T5 + T6 doc edits); opening PR, then running reviewer verification"
  last_completed: "generalist-developer executed T1-T6; orchestrator added one small unplanned README.md fix (Antigravity manual-activation step, surfaced by T3's own research)"
  current_blocker: ""

artifacts:
  requirements: "docs/context-parity/requirements.yaml"
  plan: "docs/context-parity/plan.yaml"
  implementation_report: "docs/context-parity/implementation-report.yaml"

pr:
  number: null
  url: null
  status: "not_opened"

agents:
  - id: "orchestrator"
    role: "orchestrator"
    model_guidance: "xhigh"
    status: "active"
    stage: "discovery"
    task: "coordinating discovery research"
    last_update: ""
    blocker: ""

loops:
  planning_review:
    count: 1
    max: 2
  execution_verification:
    count: 0
    max: 2

checkpoint:
  pre_execution_required: true
  pre_execution_status: accepted
  options:
    - proceed
    - revise_plan
    - narrow_scope
    - stop

blockers: []
decisions:
  - "Mode set to investigation, with likely promotion to bounded-feature once findings land, since the user expects concrete framework edits, not just a report."
  - "Branch work/context-parity created immediately (before discovery artifacts were written) to avoid any direct commits to main while working on this repo, consistent with the rule being investigated."
  - "User checkpoint (round 2): accept investigation-mode branch churn as a documented tradeoff (no mode-specific exceptions)."
  - "User checkpoint (round 2, mid-turn addition): docs/<feature>/*.yaml are ephemeral $work scratch, deleted from the branch once the user confirms merge intent — added as T6. Does not apply to pre-existing project docs."
  - "User checkpoint (round 3): Proceed. Execution approved for T1-T6's doc edits; T6's actual deletion of docs/context-parity/ is deferred until the user explicitly confirms they are merging this PR."

next_action: "Spawn repo-researcher (repo-local: existing anchoring mechanisms, root AGENTS.md sizes across consuming projects, branch/PR rule coverage) and platform-researcher (external: Codex CLI / Antigravity / Claude Code context retention and compaction mechanics) in parallel."
next_recommended_command: "$work"
user_input_needed: false
