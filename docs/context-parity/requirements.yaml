# Contract: durable task-definition handoff created by $work when the selected mode needs explicit requirements

artifact: requirements
feature: "context-parity"
mode: "bounded-feature"
status: draft
owner_skill: work

summary:
  problem: >
    Claude Code follows this framework's $work process far more reliably over
    long sessions than Codex CLI or Antigravity, which tend to drift and
    "forget" the process. The framework currently does nothing tool-specific
    to compensate, and has two independent, confirmed gaps that make the
    problem worse than it needs to be.
  motivation: >
    The user wants near-parity across all three tools, and separately wants
    the existing "branch + PR, never commit to main" rule made explicit and
    unambiguous rather than implied.
  requested_outcome: >
    Concrete framework changes that (a) close the confirmed gaps, (b) give
    Antigravity and Codex CLI the strongest re-anchoring mechanisms each tool
    actually supports, and (c) make the no-direct-to-main rule an explicit,
    literal statement enforced at the earliest possible point in the process.

goals:
  - "State the 'never commit directly to the base/main branch' rule explicitly, not just implied by branch/PR step ordering."
  - "Move feature-branch creation earlier in the documented Process so no docs/<feature>/*.yaml artifact is ever written on the base branch, for any mode including quick-fix."
  - "Make docs/<feature>/*.yaml artifacts (status/requirements/plan/implementation-report) explicitly ephemeral: once the user confirms they are merging, $work deletes docs/<feature>/ from the branch and pushes that removal as a final commit before merge. These are $work's own live coordination scratch state, not project deliverables. Any genuinely pre-existing project documentation the feature touched must still be kept up to date, not deleted — the distinction is pre-existing docs vs. $work's own generated process docs."
  - "Give Antigravity a working Always-On rule under .agents/rules/ that re-asserts the core $work invariants every turn — a mechanism this framework currently does not use at all."
  - "Strengthen tool-agnostic re-anchoring (repeated re-reads of status.yaml/AGENTS.md at each internal stage transition, not just a one-time 'first read order') to partially mitigate Codex CLI's lack of any re-injection primitive, and as a hedge against Claude Code's own reported (unresolved) CLAUDE.md-loss-after-/compact issue."
  - "Document the confirmed research findings and their sourcing in provider-notes.md so this isn't re-derived from scratch later, per that file's own stated purpose."

non_goals:
  - "Building a custom compaction/summarization system — none of the three tools expose a hook for this to a project-local framework."
  - "Fully solving Codex CLI's documented drift — OpenAI's own response attributes part of it to model training, which this framework cannot fix from the outside. Treat Codex mitigations as best-effort, not a guarantee."
  - "Retroactively cleaning up past direct-to-main commits in consuming repos (chronicle, nba-asset-lineage, cfb-rankings, personal-site) — out of scope for this feature; only the framework's own rules/process change here."
  - "Migrating chronicle's already-existing local AGENTS.md fix — its explicit prohibition is a good pattern to generalize into the shared framework, but editing chronicle's own repo is not part of this feature."

constraints:
  technical:
    - "Codex CLI: 32 KiB (project_doc_max_bytes) hard cap on concatenated AGENTS.md content, silently truncated past that with no warning (confirmed still-current via closed-not-planned openai/codex#7138). All 5 consuming repos are well under this cap today (largest root AGENTS.md: chronicle at 7,555 bytes) — not an active problem, but keep new content lean so it stays that way."
    - "Antigravity Always-On rules: 12,000-char cap per rule file (antigravity.google/docs/rules-workflows/). No documented guarantee that Always-On rules survive compaction under context pressure — treat as 'best available lever,' not a proven fix."
    - "Antigravity rules silently fail to load entirely if .agents/ (or .agent/) is gitignored, even with 'Agent Gitignore Access' enabled (dyoshikawa/rulesync#981). Must verify .agents/ is not gitignored in any consuming repo before relying on this."
    - "Codex CLI has no re-injection or Always-On-equivalent primitive at all — AGENTS.md is loaded once per session as ordinary conversation history, refreshed only by restarting Codex. There is no framework-level lever to force mid-session re-anchoring on Codex beyond what's already conversational (repeated self-instruction to re-read files)."
  product:
    - "Fixes must be portable/shared-framework-level (land in agent-skills, propagate via subtree pull) rather than per-project patches — chronicle's local fix is evidence the per-project route already exists and isn't sufficient by itself."
  process:
    - "This feature itself must follow the branch+PR rule it is hardening: already on work/context-parity, no artifact has been committed to main."

assumptions:
  - "The observed Claude Code advantage is real and at least partly explained by context-loading/retention differences, per platform-researcher's dated evidence, but it is not an absolute guarantee (Claude Code has its own unresolved CLAUDE.md-after-/compact GitHub issue) — messaging in the framework should say 'meaningfully more robust,' not promise immunity for any tool."
  - "Antigravity's Always-On rules mode, despite uncertain compaction survival, is still strictly better than the framework's current baseline of using it not at all."

repo_context:
  relevant_paths:
    - ".agents/AGENTS.md (this repo's root, imported as-is)"
    - "skills/work/SKILL.md (Process steps 1-12; step 7 currently creates the branch only after status/requirements/plan.yaml already exist)"
    - "references/branch-and-pr-workflow.md (Branch Creation section; no explicit prohibition language)"
    - "references/workflow-architecture.md (quick-fix mode framing: 'broad planning would be overhead' — same framing risks being read as license to skip branching too)"
    - "references/provider-notes.md (Persistent root instructions table; single unused mention of .agents/rules/ at line 38)"
    - "templates/status.yaml, templates/requirements.yaml, templates/plan.yaml (artifact contracts; no field currently records which branch an artifact was written on)"
    - "(new) .agents/rules/ — does not exist yet anywhere in this repo"
  systems_in_scope:
    - "agent-skills framework repo (this repo)"
    - "5 consuming repos receive changes only via their next `git subtree pull` — not edited directly by this feature"
  prior_artifacts: []

research:
  repo_findings:
    - "No `.agents/rules/` directory exists anywhere in this repo; the only reference to it is one table cell in provider-notes.md:38. The framework has never used Antigravity's Always-On mode."
    - "The 'never commit to main' rule is never stated as an explicit prohibition anywhere in branch-and-pr-workflow.md or SKILL.md — it's only implied by the positive instruction to branch-then-PR."
    - "SKILL.md Process order writes status.yaml (step 2) and requirements/plan.yaml (steps 4-5) BEFORE the feature branch is created (step 7) — meaning discovery/planning artifacts are, per the documented order, written while still on whatever branch the session started on (typically main), with no explicit exception or workaround documented."
    - "Real-world evidence this gap manifests: chronicle has ~13 direct-to-main feature/fix commits pre-dating a local fix the user already added to chronicle's own root AGENTS.md ('Never commit or execute stage feature work directly on main'); nba-asset-lineage has ~30 direct-to-main commits between two PR merges; cfb-rankings and personal-site have smaller isolated exceptions, including at least one (cfb-rankings' daa0bca) that is exactly a status-doc-only commit landing outside a branch — consistent with the SKILL.md step-ordering gap as a plausible contributing cause. No commit-message evidence ties any specific instance to a specific coding tool."
    - "All 5 consuming repos' root AGENTS.md/CLAUDE.md sizes are well under Codex's 32 KiB cap (largest: chronicle 7,555 bytes); this specific failure mode is confirmed-real for Codex CLI in general but not currently triggered by this framework's own content."
  platform_findings:
    - "Codex CLI: AGENTS.md built once per session, injected as ordinary conversation history, no refresh without restart (developers.openai.com/codex/guides/agents-md); 32 KiB truncation cap confirmed current, no warning, fix declined (openai/codex#7138, closed not-planned 2026-03-02); two dated, first-party-acknowledged issues (openai/codex#18517, #3923) document Codex drifting/forgetting instructions mid-session, with OpenAI attributing this partly to model training rather than confirming an architectural cause."
    - "Antigravity: Always-On rules mode exists and is documented as 'always applied' (antigravity.google/docs/rules-workflows/), but there is no documentation or reverse-engineered evidence that Always-On rules are protected from compaction under context pressure — the most detailed available internals analysis (community gist) shows aggressive checkpoint-based pruning with no special-casing found for rules/AGENTS.md content. Two additional bugs found: rules silently fail to load if `.agents/`/`.agent/` is gitignored (dyoshikawa/rulesync#981); users report hard context-limit crashes rather than graceful compaction, with Antigravity explicitly contrasted unfavorably against Claude Code's and Cursor's auto-compaction (Google AI Developer Forum, 2026-03-03, acknowledged but no fix/timeline given)."
    - "Claude Code: design intent is closer to a protected system-level invariant for CLAUDE.md (per public system-prompt reverse-engineering and the framework's own long-standing observation), but this is not airtight — an unresolved, stale-closed GitHub issue (anthropics/claude-code#24460) reports CLAUDE.md rules vanishing after /compact in some real sessions, with no maintainer technical rebuttal, only auto-closure for inactivity."

acceptance_criteria:
  - "branch-and-pr-workflow.md (or SKILL.md) contains an explicit, literal sentence prohibiting direct commits to the base/main branch, not just implied ordering."
  - "SKILL.md's Process reorders branch creation to occur before any docs/<feature>/*.yaml file is first written, for every mode (including quick-fix), while preserving the existing pre-execution checkpoint semantics for requirements/plan review."
  - "A new .agents/rules/ file exists with an Always-On-mode rule (frontmatter/activation per Antigravity's documented format) restating: the core $work stage model, the status.yaml re-anchor instruction, and the explicit no-direct-to-main rule — kept well under the 12,000-char cap and dense enough to survive being skimmed."
  - "AGENTS.md's 'First Read Order' / re-anchoring guidance is strengthened to trigger at every internal stage transition, not just once at session start, worded tool-agnostically (helps Codex CLI's total lack of re-injection and hedges Claude Code's own /compact issue, in addition to Antigravity)."
  - "provider-notes.md is updated with a dated summary of this research (sources, findings, 'last verified' date) so future work doesn't re-derive it."
  - "This feature's own work lands via PR from work/context-parity — never a direct commit to agent-skills' main — demonstrating the hardened rule in practice."
  - "SKILL.md's Process and branch-and-pr-workflow.md's Completion section both state that docs/<feature>/ is deleted (git rm, committed) once the user confirms they are merging, and that this deletion is scoped only to $work's own generated artifacts — never to pre-existing project docs."
  - "This feature's own docs/context-parity/ directory is itself deleted from work/context-parity before the resulting PR is merged, as a live demonstration of the new rule."

open_questions:
  - "Should the Always-On rule content be static/generic (safe to ship via subtree as-is) or should it reference the current feature's status.yaml path (which would require it to be a template, not a shipped file)? Recommendation in plan: keep it fully generic/framework-level, pointing at the docs/<feature>/status.yaml pattern rather than a specific path, so it survives the subtree-import model unmodified."
  - "Should quick-fix mode's framing in workflow-architecture.md ('broad planning would be overhead') be reworded to avoid implying branching itself is also skippable? Recommendation in plan: yes, add one clarifying line."

ready_for_planning: true
planning_blockers: []
