# Contract: bounded subagent handoff created by $work in any internal stage

artifact: task_handoff
feature: "<feature-slug>"
mode: "bounded-feature"
execution_batch_id: ""
task_id: ""
assigned_domain: ""
branch: ""
owner_skill: work

model_routing:
  task_profile: "implementation"
  uncertainty: "medium"
  consequence: "medium"
  scope_size: "bounded"
  determinism: "interpretive"
  requested_tier: "balanced"
  requested_reasoning: "medium"
  provider: ""
  provider_model: ""
  routing_enforced: false
  actual_model: ""
  actual_reasoning: ""
  escalation_tier: "frontier"
  escalation_condition: ""
  escalation_count: 0

objective: ""
why_this_matters: ""

inputs:
  requirements: "docs/<feature>/requirements.yaml"
  plan: "docs/<feature>/plan.yaml"
  implementation_report: "docs/<feature>/implementation-report.yaml"
  relevant_paths: []

scope:
  owned: []
  forbidden: []

implementation_notes: []

success_criteria: []

validation_expected: []

output_format:
  sections:
    - Changes
    - Local Validation
    - Blockers
    - Notes

escalate_if:
  - missing_context
  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
  - selected_model_insufficient_with_evidence
